version: "3.8"

networks:
  core:
    external: true

services:
  snorql:
    image: ghcr.io/marvinm2/aop-wiki-snorql-ui:latest
    networks:
      - core
    environment:
      - SNORQL_ENDPOINT=${SNORQL_ENDPOINT:-https://aopwiki.rdf.bigcat-bioinformatics.org/sparql}
      - SNORQL_EXAMPLES_REPO=${SNORQL_EXAMPLES_REPO:-https://github.com/marvinm2/AOP-Wiki-Queries}
      - SNORQL_TITLE=${SNORQL_TITLE:-AOP-Wiki RDF Explorer}
      - WELCOME_TITLE=${WELCOME_TITLE:-AOP-Wiki RDF Explorer}
      - WELCOME_MESSAGE=${WELCOME_MESSAGE:-<p>Browse and run SPARQL queries against the AOP-Wiki RDF endpoint.</p><ul><li><strong>Browse examples</strong> in the tree on the right — queries are organised by Adverse Outcome Pathways, Key Events, Key Event Relationships, Stressors, and federated queries</li><li><strong>Edit parameters</strong> to customise queries for your AOP, KE, or stressor of interest</li><li><strong>Write your own SPARQL</strong> directly in the editor below — namespace prefixes for the AOP ontology and identifier services are pre-loaded</li></ul>}
      - DEFAULT_GRAPH=${DEFAULT_GRAPH:-}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.http.routers.aopwiki-snorql.rule=Host(`aopwiki-rdf.vhp4safety.nl`,`aopwiki.rdf.bigcat-bioinformatics.org`)
        - traefik.http.routers.aopwiki-snorql.entrypoints=websecure
        - traefik.http.routers.aopwiki-snorql.tls=true
        - traefik.http.routers.aopwiki-snorql.tls.certresolver=letsencrypt
        - traefik.http.services.aopwiki-snorql.loadbalancer.server.port=80
        - traefik.docker.network=core
        # Ownership / metadata (admin-facing; not used by Traefik)
        - tgx.service.owner=marvin.martens@maastrichtuniversity.nl
        - tgx.service.team=Translational Genomics, Maastricht University
        - tgx.service.repo=https://github.com/marvinm2/AOP-Wiki-Snorql-UI
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # REST API over the Virtuoso below (source: github.com/marvinm2/AOP-Wiki-API). Stateless, so
  # start-first. Served under /api on the explorer hosts: Traefik strips the prefix and the app
  # reads X-Forwarded-Prefix for its docs and links. The container healthcheck is in the image.
  # It talks to Virtuoso over `core` by its stack-qualified name; plain `virtuoso` is ambiguous
  # there because other stacks also have a service with that name.
  api:
    image: ghcr.io/marvinm2/aop-wiki-api:${API_TAG:-latest}
    networks:
      - core
    environment:
      - SPARQL_ENDPOINT=http://aopwiki-snorql_virtuoso:8890/sparql
      - DATA_GRAPH=http://aopwiki.org/
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=core
        - traefik.http.services.aopwiki-api.loadbalancer.server.port=8000
        # /api on the explorer hosts: above the UI catch-all router (default priority = rule
        # length, ~76) and below the /sparql router (100).
        - traefik.http.routers.aopwiki-api.rule=Host(`aopwiki-rdf.vhp4safety.nl`,`aopwiki.rdf.bigcat-bioinformatics.org`) && (Path(`/api`) || PathPrefix(`/api/`))
        - traefik.http.routers.aopwiki-api.priority=90
        - traefik.http.routers.aopwiki-api.entrypoints=websecure
        - traefik.http.routers.aopwiki-api.tls=true
        - traefik.http.routers.aopwiki-api.tls.certresolver=letsencrypt
        - traefik.http.routers.aopwiki-api.middlewares=aopwiki-api-strip
        - traefik.http.routers.aopwiki-api.service=aopwiki-api
        - traefik.http.middlewares.aopwiki-api-strip.stripprefix.prefixes=/api
        # Cutover from the aopwiki-grlc stack: uncomment to take over the dedicated API host
        # (priority 200 wins over grlc's router; remove these labels again to roll back).
        # - traefik.http.routers.aopwiki-api-host.rule=Host(`aopwiki.api.bigcat-bioinformatics.org`)
        # - traefik.http.routers.aopwiki-api-host.priority=200
        # - traefik.http.routers.aopwiki-api-host.entrypoints=websecure
        # - traefik.http.routers.aopwiki-api-host.tls=true
        # - traefik.http.routers.aopwiki-api-host.tls.certresolver=letsencrypt
        # - traefik.http.routers.aopwiki-api-host.service=aopwiki-api
        - tgx.service.owner=marvin.martens@maastrichtuniversity.nl
        - tgx.service.team=Translational Genomics, Maastricht University
        - tgx.service.repo=https://github.com/marvinm2/AOP-Wiki-API
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Single-graph Virtuoso serving the live AOP-Wiki RDF dataset (graph
  # http://aopwiki.org/). Ported from the strato1 AOP-Wiki-EP deployment so the
  # SNORQL UI no longer depends on the external bigcat endpoint. Not node-pinned:
  # swarm may run it on either node (data is on replicated GlusterFS). stop-first
  # guarantees only one container ever opens virtuoso.db at a time, and the
  # weekly reload runs on both nodes with a top-of-script guard so only the node
  # currently hosting this task does the `docker exec` load.
  virtuoso:
    # Pinned to the digest the service runs on: `docker stack deploy` re-resolves a plain tag,
    # and an upstream retag would restart this Virtuoso (the 2026-09-02 empty-store incident
    # followed a restart of this GlusterFS-backed database).
    image: openlink/virtuoso-opensource-7:7.2.11@sha256:09a3cadc653344f198af96214187d3a1eb0d5ab5b8278bbd8243ca55845f9efe
    networks:
      - core
    environment:
      - DBA_PASSWORD=${DBA_PASSWORD:-dba}
      - SPARQL_UPDATE=false
      - VIRT_Parameters_DirsAllowed=., ../vad, /usr/share/proj, /database/data
    volumes:
      - /mnt/gluster/docker/aopwiki-snorql/virtuoso-data:/database
    deploy:
      replicas: 1
      update_config:
        order: stop-first
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        # SPARQL endpoint at /sparql on the same host(s) as the UI. More specific
        # than the UI router (PathPrefix), and given explicit higher priority.
        - traefik.http.routers.aopwiki-snorql-sparql.rule=Host(`aopwiki-rdf.vhp4safety.nl`,`aopwiki.rdf.bigcat-bioinformatics.org`) && PathPrefix(`/sparql`)
        - traefik.http.routers.aopwiki-snorql-sparql.entrypoints=websecure
        - traefik.http.routers.aopwiki-snorql-sparql.tls=true
        - traefik.http.routers.aopwiki-snorql-sparql.tls.certresolver=letsencrypt
        - traefik.http.routers.aopwiki-snorql-sparql.priority=100
        - traefik.http.services.aopwiki-snorql-sparql.loadbalancer.server.port=8890
        - traefik.docker.network=core
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8890' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
